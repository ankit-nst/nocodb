name: Helm Lint Charts
on:
  pull_request:
    types: [opened]
    branches:
      - main
  push:
    branches:
      - main
jobs:
  lint:
    if: github.event_name == 'push'  # Only run on PR merge
    runs-on: nst-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Helm
        uses: azure/setup-helm@v1
        with:
          version: 'v3.15.3'  # Specify the Helm version you want to use
      - name: Lint Xorro Apps
        run: |
          for chart in ./xorro/xorro-apps/*; do
            if [ -d "$chart" ]; then
              echo "Linting chart: $chart"
              helm lint "$chart"
            fi
          done
      - name: Lint AWS Apps
        run: |
          for chart in ./infra/aws-apps/*; do
            if [ -d "$chart" ]; then
              echo "Linting chart: $chart"
              helm lint "$chart"
            fi
          done
      - name: Lint Infra Apps
        run: |
          for chart in ./infra/infra-apps/*; do
            if [ -d "$chart" ]; then
              echo "Linting chart: $chart"
              helm lint "$chart"
            fi
          done
      - name: Lint Infra Jobs
        run: |
          for chart in ./infra/infra-jobs/*; do
            if [ -d "$chart" ]; then
              echo "Linting chart: $chart"
              helm lint "$chart"
            fi
          done
