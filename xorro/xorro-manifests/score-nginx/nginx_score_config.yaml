kind: ConfigMap
apiVersion: v1
metadata:
  name: nginx-score-config
  namespace: xorro
data:
    nginx_score_config.conf: |
        server {
            listen       80;
            listen  [::]:80;
            server_name  localhost;
            error_page   500 502 503 504  /50x.html;
            resolver 172.16.0.10;
            location ~ ^/score/(.*) {
                proxy_pass https://xorro-fundability-scores.s3.ap-southeast-1.amazonaws.com/$1;
                proxy_set_header Host xorro-fundability-scores.s3.ap-southeast-1.amazonaws.com;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
      
            location /health {
                access_log off;
                return 204;
            }
        
            location /robots.txt {
              add_header Content-Type text/plain;
              return 200 "User-agent: *\nDisallow: /";
            }
        
            location /maintenance {
              root  /data/www;
              index index.html;
            }
        
            location / {
              return 403;
            }

        }
        server {
            listen 80;
            server_name fundability.xorro-stage.com;
            resolver 172.16.0.10;
            location ~ ^/score/(.*) {
                proxy_pass https://xorro-fundability-scores.s3.ap-southeast-1.amazonaws.com/$1;
                proxy_set_header Host xorro-fundability-scores.s3.ap-southeast-1.amazonaws.com;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
