---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: assets-s3-pv
spec:
  capacity:
    storage: 100Gi # Ignored, required
  accessModes:
    - ReadWriteMany # Supported options: ReadWriteMany / ReadOnlyMany
  storageClassName: "" # Required for static provisioning
  claimRef: # To ensure no other PVCs can claim this PV
    namespace: xorro # Namespace is required even though it's in "default" namespace.
    name: assets-s3-pvc # Name of your PVC
  mountOptions:
    - allow-delete
    - allow-other
    - region ap-southeast-1
  csi:
    driver: s3.csi.aws.com # Required
    volumeHandle: s3-csi-driver-volume
    volumeAttributes:
      bucketName: xorro-stage-public-assets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assets-s3-pvc
spec:
  accessModes:
    - ReadWriteMany # Supported options: ReadWriteMany / ReadOnlyMany
  storageClassName: "" # Required for static provisioning
  resources:
    requests:
      storage: 100Gi # Ignored, required
  volumeName: assets-s3-pv # Name of your PV
---
