        server {
            listen 80;
            server_name api.xorro-stage.com *.vercel.app ;
            resolver 172.16.0.10;

            location ^~ /coverpic/ {
                # Global CORS headers for all locations
                    add_header Access-Control-Allow-Origin *;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                    add_header Access-Control-Allow-Headers *;
                    add_header Access-Control-Allow-Credentials true;

                # Handle preflight (OPTIONS) requests
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin *;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                    add_header Access-Control-Allow-Headers *;
                    add_header Content-Length 0;
                    add_header Content-Type text/plain;
                    return 204;
                }
                rewrite ^/coverpic(/.*)$ $1 break;  
                root /data/campaign;   
                try_files $uri $uri/ =404;               
            }
            location ^~ /creator/ {
                # Global CORS headers for all locations
                    add_header Access-Control-Allow-Origin *;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                    add_header Access-Control-Allow-Headers *;
                    add_header Access-Control-Allow-Credentials true;

                # Handle preflight (OPTIONS) requests
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin *;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                    add_header Access-Control-Allow-Headers *;
                    add_header Content-Length 0;
                    add_header Content-Type text/plain;
                    return 204;
                }
                rewrite ^/creator(/.*)$ $1 break;  
                root /data/peeps;   
                try_files $uri $uri/ =404;             
            }
            error_page 404 /error_redirect;
            location /error_redirect {
                return 301 https://trade.xorro-stage.com/404;
            }
        }


        server {
            listen 80;
            server_name  assets.xorro-stage.com *.vercel.app ;
            resolver 172.16.0.10;
            
            location ^~ /assets/ {
                # Global CORS headers for all locations
                    add_header Access-Control-Allow-Origin *;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                    add_header Access-Control-Allow-Headers *;
                    add_header Access-Control-Allow-Credentials true;

                # Handle preflight (OPTIONS) requests
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin *;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                    add_header Access-Control-Allow-Headers *;
                    add_header Content-Length 0;
                    add_header Content-Type text/plain;
                    return 204;
                }
                rewrite ^/assets(/.*)$ $1 break;  
                root /data/assets;   
                try_files $uri $uri/ =404;            
            }
            error_page 404 /error_redirect;
            location /error_redirect {
                return 301 https://trade.xorro-stage.com/404;
            }
        }
