provider: emissary
virtualServices:
  default:
    enabled: true
    certificate:
      create: true
    hosts:
      - logs.xorro-stage.com
    httpRoutes:
      - match:
          - uri:
              prefix: /
        action:
          route:
            - host: opensearch-dashboards.opensearch-dashboards
              port: 5601
        options:
          timeout: "60000"

