apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-set
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: &repo git@github.com:newsocialtheory/argo-xorro-stage.git
        revision: HEAD
        directories:
          - path: infra/aws-apps/*
  template:
    metadata:
      name: "{{path.basename}}"
      labels: {}
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: infra
      sources:
        - repoURL: *repo
          path: "{{path}}"
          targetRevision: HEAD
          helm:
            releaseName: "{{path.basename}}"
            valueFiles:
              - $valuesRepo/{{path}}/values.yaml
        - repoURL: *repo
          targetRevision: HEAD
          ref: valuesRepo
      destination:
        name: in-cluster
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
