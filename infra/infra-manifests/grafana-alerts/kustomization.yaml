apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
    name: grafana-alerts
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana-alerts: "1"
configMapGenerator:
  - name: pods-cpu
    files:
      - json/pods-cpu.json
  - name: pods-memory
    files:
      - json/pods-memory.json