apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  namespace: cert-manager
spec:
  acme:
    privateKeySecretRef:
      name: letsencrypt
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers:
      - selector:
          dnsZones:
            - xorro-stage.com
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cert-manager-secrets
              key: apiToken