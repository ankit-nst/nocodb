---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  instanceProfile: stage-eks_nodes
  amiFamily: AL2023
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: stage-private
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: stage-cluster
  tags:
    Name: karpenter/default
    OU: NST
    Region: sg
    Project: argo-xorro-stage
    Environment: stage
    Location: xorro-stage
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        encrypted: false
        #kmsKeyID: "fa59ff2e-0291-4645-8dd4-20c03a75253d"
        deleteOnTermination: true
        throughput: 125
