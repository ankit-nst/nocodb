---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opensearch-secrets
  namespace: opensearch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: opensearch-ss
    kind: SecretStore
  target:
    name: opensearch-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: opaque
      data:
        opensearch-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "aws-xorro/stage/helm_opensearch"
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: opensearch-ss
  namespace: opensearch
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: opensearch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::011528281799:role/stage-eks-opensearch
  name: opensearch
  namespace: opensearch
