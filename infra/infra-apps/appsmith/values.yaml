    APPSMITH_MAIL_ENABLED: "true"
    APPSMITH_MAIL_HOST: "mailhog.mailhog"
    APPSMITH_MAIL_PORT: "1025"
    APPSMITH_MAIL_FROM: &email "no-reply@xorro-stage.com"
    APPSMITH_REPLY_TO: *email
