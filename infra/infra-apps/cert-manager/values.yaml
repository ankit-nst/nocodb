cert-manager:
  installCRDs: true
  serviceAccount:
    annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::011528281799:role/stage-eks-cert-manager
  prometheus:
    enabled: false
    servicemonitor:
      enabled: false
  securityContext:
    enabled: true
    fsGroup: 1001
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 256Mi
  webhook:
    replicaCount: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 256Mi
  cainjector:
    enabled: true
    replicaCount: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 256Mi
